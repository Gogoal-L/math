name: DPT mathematics auditors

on:
  # Validate feature branches once through pull_request; main pushes still get a full run.
  push:
    branches:
      - main
    paths:
      - "dpt_tools/**"
      - "DPT_MATH_RESEARCH_MAP.md"
      - "dpt_research/**"
      - ".github/workflows/dpt-math-auditors.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dpt_tools/**"
      - "DPT_MATH_RESEARCH_MAP.md"
      - "dpt_research/**"
      - ".github/workflows/dpt-math-auditors.yml"
  workflow_dispatch:

# Cancel obsolete runs for the same PR/ref when a newer commit arrives.
concurrency:
  group: dpt-math-auditors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-dpt-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only DPT auditors
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            dpt_tools
            DPT_MATH_RESEARCH_MAP.md
            dpt_research
          sparse-checkout-cone-mode: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fail fast: this checker uses only the Python standard library.
      - name: Audit GitHub-compatible math syntax and extract equations
        run: |
          python dpt_tools/markdown_math_audit.py \
            DPT_MATH_RESEARCH_MAP.md \
            dpt_research/*.md \
            dpt_tools/README.md \
            --dump-json /tmp/dpt-math-equations.json

      - name: Install auditor dependencies
        run: python -m pip install -r dpt_tools/requirements.txt
      - name: Compile audit modules
        run: python -m compileall -q dpt_tools
      - name: Run entire discovered DPT auditor regression suite
        working-directory: dpt_tools
        run: python -m unittest discover -v -p 'test_*.py'

      - name: Set up Node for independent MathJax source rendering
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install MathJax engine (isolated CI dependency)
        run: npm install --prefix /tmp/dpt-math-tex --no-save mathjax-full@3.2.2
      - name: Compile every math expression with MathJax
        run: NODE_PATH=/tmp/dpt-math-tex/node_modules node dpt_tools/compile_mathjax.js /tmp/dpt-math-equations.json
      - name: Inspect actual GitHub GFM Markdown API output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,re,sys,urllib.request
          from pathlib import Path
          sys.path.insert(0, 'dpt_tools')
          from markdown_math_audit import extract_math
          files = ['DPT_MATH_RESEARCH_MAP.md','dpt_tools/README.md']
          files += [str(p) for p in sorted(Path('dpt_research').glob('*.md'))]
          for file in files:
              source = Path(file).read_text(encoding='utf8')
              expected_math_count = len(extract_math(source))
              payload=json.dumps({'text':source,'mode':'gfm',
                                  'context':'Gogoal-L/math'}).encode('utf8')
              req=urllib.request.Request('https://api.github.com/markdown',data=payload,
                  headers={'Accept':'text/html','Content-Type':'application/json',
                           'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                           'X-GitHub-Api-Version':'2022-11-28'},method='POST')
              with urllib.request.urlopen(req,timeout=40) as response:
                  html=response.read().decode('utf8')
              actual_math_count = html.count('<math-renderer ')
              assert actual_math_count == expected_math_count, (
                  f'GitHub GFM rendered {actual_math_count}/{expected_math_count} '
                  f'math nodes in {file}; code/preprocessed formula regression')
              print('GITHUB_GFM_VERIFIED', file,
                    actual_math_count, '/', expected_math_count,
                    'recognized MathJax nodes')
              print('GITHUB_GFM_RENDER',file,'html_bytes',len(html),
                    'math_renderer',html.count('math-renderer'),
                    'language_math',html.count('language-math'),
                    'math_display',html.count('math-display'),
                    'M33',html.count('M33'),'M54',html.count('M54'))
              marker=html.find('math-renderer')
              if marker<0: marker=html.find('language-math')
              print('GITHUB_GFM_MATH_CONTEXT',repr(html[max(0,marker-90):marker+360]))
              if Path(file).name=='DPT_MATH_RESEARCH_MAP.md':
                  assert 'MAIN_ACCEPTED' in html and 'SIDE_VERIFIED' in html, 'DPT controller-side transfer state lost'
          PY
