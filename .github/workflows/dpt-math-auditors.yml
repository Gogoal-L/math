name: DPT mathematics auditors

on:
  push:
    paths:
      - "dpt_tools/**"
      - ".github/workflows/dpt-math-auditors.yml"
  pull_request:
    paths:
      - "dpt_tools/**"
      - ".github/workflows/dpt-math-auditors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dpt-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only DPT auditors
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            dpt_tools
          sparse-checkout-cone-mode: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install auditor dependencies
        run: python -m pip install -r dpt_tools/requirements.txt
      - name: Compile audit modules
        run: python -m compileall -q dpt_tools
      - name: Run original and frontier regression tests
        working-directory: dpt_tools
        run: python -m unittest -v test_dpt_tools.py test_frontier_tools.py
