name: One-time completed Math test-branch cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-completed-math-branch.yml"
permissions:
  contents: write
  pull-requests: read
jobs:
  remove-completed-test-branch:
    if: github.repository == 'Gogoal-L/math' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only closed PR 4's completed test branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh api repos/Gogoal-L/math/pulls/4 --jq .state)"
          if [[ "$state" != "closed" ]]; then
            echo "PR #4 must be closed before stale branch cleanup" >&2
            exit 1
          fi
          gh api --method DELETE repos/Gogoal-L/math/git/refs/heads/research/20261011-continuous-goal-information
          echo "Deleted only the prior completed research/test branch"
